<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Galería de fotos | Certificación LíDER 21</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ox:#3C3C3B; --ox-deep:#262625; --ox-soft:#55554F;
  --au:#FDB913; --au-2:#F5A300; --au-text:#8A6200;
  --ink:#1F1F1E; --text:#3C3C3B; --muted:#6B6B66;
  --mist:#F5F5F3; --line:#E4E3DF; --white:#FFFFFF;
  --grad-ox:linear-gradient(180deg,#4B4B49 0%,#262625 100%);
  --grad-ox-d:linear-gradient(145deg,#4A4A48 0%,#262625 100%);
  --grad-au:linear-gradient(180deg,#FDC530 0%,#F29E00 100%);
  --grad-au-d:linear-gradient(145deg,#FDC530 0%,#EE9A00 100%);
  --shadow:0 22px 44px -28px rgba(38,38,37,.55);
  --wrap:1280px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:110px}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--white);color:var(--ox);font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%;display:block}
button{font:inherit}
:focus-visible{outline:3px solid var(--au-2);outline-offset:4px;border-radius:12px}
.wrap{width:min(var(--wrap),100% - 48px);margin-inline:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Encabezado ---------- */
.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:saturate(1.4) blur(8px);box-shadow:0 1px 0 var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{height:88px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{display:flex;align-items:center;gap:18px;text-decoration:none;color:inherit}
.brand img{height:62px;width:auto}
.brand-tag{padding-left:18px;border-left:2px solid var(--line);font-size:15px;font-weight:600;color:var(--ox);line-height:1.2}
.brand-tag small{display:block;font-size:12px;font-weight:500;color:var(--muted)}

/* ---------- Botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border-radius:12px;font-size:16px;font-weight:600;text-decoration:none;cursor:pointer;border:2px solid transparent;transition:transform .15s ease,filter .15s ease,background .15s ease}
.btn svg{width:18px;height:18px;flex-shrink:0}
.btn-primary{background:var(--grad-au);color:var(--ox-deep);box-shadow:0 12px 24px -12px rgba(242,158,0,.9)}
.btn-primary:hover{filter:brightness(1.05);transform:translateY(-1px)}
.btn-dark{background:var(--grad-ox);color:#fff;box-shadow:0 12px 24px -12px rgba(38,38,37,.8)}
.btn-dark:hover{filter:brightness(1.15);transform:translateY(-1px)}
.btn-outline{border-color:var(--ox);color:var(--ox);background:#fff}
.btn-outline:hover{background:var(--mist)}
.btn-lg{min-height:60px;padding:0 34px;font-size:18px;border-radius:14px}
.btn[aria-disabled="true"]{background:#E4E3DF;color:#8C8C86;box-shadow:none;cursor:not-allowed;transform:none;filter:none}

/* ---------- Lienzo diagonal compartido ---------- */
.canvas{position:relative;background:linear-gradient(115deg,#fff 0%,#F2F2EF 100%);overflow:hidden;border-radius:30px;box-shadow:var(--shadow)}
.facet{position:absolute;inset:0;background:#FAFAF8;clip-path:polygon(0 0,32% 0,12% 100%,0 100%)}

/* ---------- Banner principal ---------- */
.hero{margin-top:36px}
.hero-c{min-height:500px;display:grid;grid-template-columns:1.1fr 1fr;align-items:center}
.hero-c .slab{position:absolute;inset:0;background:var(--grad-ox-d);clip-path:polygon(58% 0,100% 0,100% 100%,45% 100%)}
.hero-c .hair{position:absolute;inset:0;background:var(--au);clip-path:polygon(55.2% 0,56.1% 0,43.1% 100%,42.2% 100%)}
.hero-c .stripes{position:absolute;inset:0;clip-path:polygon(58% 0,100% 0,100% 100%,45% 100%)}
.hero-c .stripes svg{position:absolute;right:0;bottom:0;height:100%;width:auto}
.hero-copy{position:relative;z-index:2;padding:56px 0 56px 7%}
.k1{display:block;font-size:clamp(22px,2.5vw,34px);font-weight:500;line-height:1.1;color:var(--ox)}
.k2{margin:4px 0 0;font-size:clamp(40px,5.4vw,74px);font-weight:800;line-height:1.02;letter-spacing:-.015em;padding-top:.06em;background:var(--grad-ox);-webkit-background-clip:text;background-clip:text;color:transparent}
.bar{display:flex;align-items:center;margin-top:18px}
.bar i{display:block;height:4px;width:190px;background:var(--ox)}
.bar b{display:block;height:12px;width:52px;background:var(--au);transform:skewX(-30deg);margin-left:-6px}
.lead{margin:22px 0 30px;font-size:clamp(17px,1.6vw,21px);line-height:1.5;color:var(--text);font-weight:500}
.hero-logo{position:relative;z-index:2;display:flex;justify-content:flex-end;padding:40px 7% 40px 16%}
.hero-logo img{width:100%;max-width:440px;height:auto}

/* ---------- Encabezado de sección ---------- */
.sec{margin-top:72px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:28px}
.sec-title{margin:0;font-size:clamp(30px,3.4vw,44px);font-weight:800;line-height:1.1;color:var(--ox)}
.sec-line{display:flex;align-items:center;margin-top:12px}
.sec-line i{display:block;width:150px;height:4px;background:var(--ox)}
.sec-line b{display:block;width:46px;height:12px;background:var(--au);transform:skewX(-30deg);margin-left:-6px}
.sec-sub{margin:0;max-width:430px;font-size:17px;line-height:1.55;color:var(--text)}

/* ---------- Buscador y filtros ---------- */
.tools{display:flex;flex-direction:column;gap:16px;padding:22px;background:var(--mist);border-radius:22px;margin-bottom:36px}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:16px;font-weight:500;padding:16px 18px 16px 52px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ox)}
.search input::placeholder{color:#94948E}
.search input:focus{outline:none;border-color:var(--au-2);box-shadow:0 0 0 4px rgba(253,185,19,.25)}
.search svg{position:absolute;left:18px;top:50%;translate:0 -50%;width:20px;height:20px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{font-size:14px;font-weight:600;padding:9px 16px;border-radius:999px;border:2px solid var(--line);background:#fff;color:var(--ox);cursor:pointer;transition:border-color .15s ease,background .15s ease}
.chip:hover{border-color:var(--au)}
.chip[aria-pressed="true"]{background:var(--ox);border-color:var(--ox);color:#fff}
.count{font-size:14px;font-weight:500;color:var(--muted);margin:0}

/* ---------- Cohortes ---------- */
.cohort + .cohort{margin-top:44px}
.cohort-h{display:flex;flex-wrap:wrap;align-items:center;gap:12px 14px;margin:0 0 20px;font-size:20px;font-weight:700;color:var(--ox)}
.cohort-h::before{content:"";width:22px;height:9px;background:var(--au);transform:skewX(-30deg)}
.cohort-h small{font-size:14px;font-weight:500;color:var(--muted)}

/* ---------- Recuadros de grupo ---------- */
.gcards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}
.gcard{position:relative;display:block;aspect-ratio:5/4;border-radius:24px;overflow:hidden;text-decoration:none;box-shadow:var(--shadow);container-type:inline-size;transition:transform .25s ease,box-shadow .25s ease}
.gcard:hover{transform:translateY(-6px);box-shadow:0 30px 50px -28px rgba(38,38,37,.75)}
.gcard.ox{background:var(--grad-ox-d);color:#fff}
.gcard.au{background:var(--grad-au-d);color:var(--ox-deep)}
.gcard .sfacet{position:absolute;inset:0;background:rgba(255,255,255,.09);clip-path:polygon(58% 0,80% 0,52% 100%,30% 100%)}
.gcard .shair{position:absolute;inset:0;background:var(--au);clip-path:polygon(83% 0,84.4% 0,56.4% 100%,55% 100%)}
.gcard.au .sfacet{background:rgba(255,255,255,.18)}
.gcard.au .shair{background:rgba(38,38,37,.55)}
.gcard .gpre{position:absolute;left:8%;top:10%;font-size:5.4cqi;font-weight:600;letter-spacing:.12em;opacity:.9}
.gcard .gnum{position:absolute;right:7%;top:4%;font-size:30cqi;font-weight:800;line-height:1;letter-spacing:-.04em}
.gcard .gtext{position:absolute;left:8%;right:8%;bottom:26%;display:flex;flex-direction:column;gap:1.6cqi}
.gcard .gsede{font-size:8.2cqi;font-weight:800;line-height:1.1;max-width:78%}
.gcard .gdates{display:flex;align-items:center;gap:2.6cqi;font-size:4.8cqi;font-weight:500}
.gcard .gdates::before{content:"";width:6cqi;height:2.2cqi;background:var(--au);transform:skewX(-30deg);flex-shrink:0}
.gcard.au .gdates::before{background:var(--ox)}
.gcard .ggo{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;padding:4cqi 8cqi;background:linear-gradient(90deg,rgba(26,26,25,.95),rgba(50,50,48,.88));color:#fff;font-size:5cqi;font-weight:600}
.gcard .ggo span{display:grid;place-items:center;width:9cqi;height:9cqi;border-radius:50%;background:var(--au);color:var(--ox-deep);transition:background .2s ease}
.gcard:hover .ggo span{background:#fff}
.gcard .ggo svg{width:5.4cqi;height:5.4cqi}

.empty{min-height:190px;border:2px dashed #C9C8C2;border-radius:22px;background:var(--mist);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:28px;text-align:center}
.empty strong{font-size:22px;color:var(--ox)}
.empty span{font-size:15px;color:var(--muted);max-width:46ch}

/* ---------- Barras (pasos y datos del grupo) ---------- */
.mbars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 32px}
.mbar{display:flex;align-items:center;width:100%;min-height:100px}
.mbar-tab{position:relative;z-index:2;flex:0 0 128px;height:96px;border-radius:18px;clip-path:polygon(0 0,100% 0,80% 100%,0 100%);background:var(--grad-ox);display:flex;align-items:center;justify-content:center;padding-right:24px;font-size:42px;font-weight:800;color:#fff;letter-spacing:-.02em}
.mbar-tab svg{width:40px;height:40px}
.mbar-panel{flex:1;min-width:0;min-height:76px;margin-left:-44px;padding:10px 22px 10px 64px;display:flex;align-items:center;border:3px solid var(--ox);border-left:0;border-radius:0 20px 20px 0;background:linear-gradient(90deg,#fff 0%,#F0F0ED 100%)}
.mbar-t1{display:block;font-size:19px;font-weight:800;line-height:1.2;color:var(--ox)}
.mbar-t2{display:block;font-size:14px;color:var(--muted)}
.mbar.gold .mbar-tab{background:var(--grad-au);color:var(--ox-deep)}
.mbar.gold .mbar-panel{border-color:var(--au-2)}
.mbar.gold .mbar-t1{color:var(--au-text)}
.info .mbar-t1{font-size:18px}
.info .mbar-t1::first-letter{text-transform:uppercase}

/* ---------- Vista de grupo ---------- */
.backbar{margin-top:28px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px}
.back{min-height:46px;padding:0 20px 0 14px;font-size:15px;gap:8px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:15px;color:var(--muted)}
.crumbs a{color:var(--au-text);font-weight:600;text-underline-offset:4px}
.crumbs [aria-current]{font-weight:600;color:var(--ox)}
.hello{margin-top:20px;min-height:460px;display:flex;align-items:center;justify-content:center;text-align:center;padding:64px 24px}
.hello .hl{position:absolute;inset:0;background:var(--grad-ox-d);clip-path:polygon(0 0,14% 0,4% 100%,0 100%)}
.hello .hb{position:absolute;inset:0;background:var(--au);clip-path:polygon(16% 0,17% 0,7% 100%,6% 100%)}
.hello .hr{position:absolute;inset:0;background:var(--grad-ox-d);clip-path:polygon(90% 0,100% 0,100% 100%,82% 100%)}
.hello .hg{position:absolute;inset:0;background:var(--au);clip-path:polygon(87.6% 0,88.6% 0,80.6% 100%,79.6% 100%)}
.hello .inner{position:relative;display:flex;flex-direction:column;align-items:center;max-width:760px}
.hello .h1a{font-size:clamp(22px,2.6vw,34px);font-weight:500;color:var(--ox);line-height:1.2}
.hello h1{margin:4px 0 0;font-size:clamp(46px,7vw,92px);font-weight:800;line-height:1;letter-spacing:-.02em;padding-top:.06em;background:var(--grad-ox);-webkit-background-clip:text;background-clip:text;color:transparent}
.hello h1:focus{outline:none}
.hello .sede{margin-top:10px;font-size:clamp(17px,1.8vw,22px);font-weight:600;color:var(--au-text)}
.hello .bar{justify-content:center;margin:22px 0 22px}
.hello .bar i{width:220px}
.hello .msg{margin:0 0 30px;font-size:clamp(16px,1.6vw,19px);color:var(--text)}
.hello .hint{margin:14px 0 0;font-size:14px;color:var(--muted)}
.info{margin-top:40px}

/* ---------- Pie ---------- */
.foot{margin-top:88px;background:var(--ox-deep);color:#CFCFC9}
.foot-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:24px;padding:36px 0}
.foot-brand{display:flex;align-items:center;gap:18px}
.foot-brand .fchip{background:#fff;border-radius:14px;padding:8px 14px}
.foot-brand img{height:50px;width:auto}
.foot-brand strong{display:block;font-size:17px;color:#fff}
.foot-brand span{font-size:13px}
.foot-links{font-size:14px;line-height:1.6;text-align:right}
.foot-base{border-top:1px solid rgba(255,255,255,.12);padding:16px 0;font-size:13px}

/* ---------- Transición de vista ---------- */
#app:focus{outline:none}
#app > *{animation:enter .45s ease both}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}


/* ---------- Modalidad ---------- */
.mcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px}
.mcard{position:relative;display:block;aspect-ratio:16/9;border-radius:28px;overflow:hidden;text-decoration:none;box-shadow:var(--shadow);container-type:inline-size;transition:transform .25s ease,box-shadow .25s ease}
.mcard:hover{transform:translateY(-6px);box-shadow:0 30px 50px -28px rgba(38,38,37,.75)}
.mcard.ox{background:var(--grad-ox-d);color:#fff}
.mcard.au{background:var(--grad-au-d);color:var(--ox-deep)}
.mcard .sfacet{position:absolute;inset:0;background:rgba(255,255,255,.09);clip-path:polygon(62% 0,80% 0,58% 100%,40% 100%)}
.mcard .shair{position:absolute;inset:0;background:var(--au);clip-path:polygon(84% 0,84.8% 0,62.8% 100%,62% 100%)}
.mcard.au .sfacet{background:rgba(255,255,255,.18)}
.mcard.au .shair{background:rgba(38,38,37,.55)}
.mcard .micon{position:absolute;right:7%;top:12%;width:20cqi;height:20cqi;opacity:.95}
.mcard .micon svg{width:100%;height:100%}
.mcard .mpre{position:absolute;left:7%;top:12%;font-size:2.9cqi;font-weight:600;letter-spacing:.14em;opacity:.9}
.mcard .mtext{position:absolute;left:7%;right:30%;bottom:24%}
.mcard .mname{display:block;font-size:10.5cqi;font-weight:800;line-height:1;letter-spacing:-.02em}
.mcard .mdesc{display:flex;align-items:center;gap:1.6cqi;margin-top:2.2cqi;font-size:3.2cqi;font-weight:500}
.mcard .mdesc::before{content:"";width:4.4cqi;height:1.6cqi;background:var(--au);transform:skewX(-30deg);flex-shrink:0}
.mcard.au .mdesc::before{background:var(--ox)}
.mcard .ggo{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;padding:2.6cqi 7cqi;background:linear-gradient(90deg,rgba(26,26,25,.95),rgba(50,50,48,.88));color:#fff;font-size:3.2cqi;font-weight:600}
.mcard .ggo span{display:grid;place-items:center;width:6cqi;height:6cqi;border-radius:50%;background:var(--au);color:var(--ox-deep);transition:background .2s ease}
.mcard:hover .ggo span{background:#fff}
.mcard .ggo svg{width:3.4cqi;height:3.4cqi}
.gcard .gnum.sm{font-size:25cqi;top:6%}
.modetag{display:inline-flex;align-items:center;gap:8px;margin-bottom:10px;font-size:14px;font-weight:600;letter-spacing:.12em;color:var(--au-text)}
.modetag::before{content:"";width:18px;height:7px;background:var(--au);transform:skewX(-30deg)}

.info4{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:820px){.info4{grid-template-columns:1fr}.mcards{grid-template-columns:1fr;gap:18px}}


/* ---------- Buscador global ---------- */
.finder-wrap{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:max(5vh,16px) 16px 16px;background:rgba(38,38,37,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.finder-wrap[hidden]{display:none}
.finder{width:min(680px,100%);max-height:calc(100vh - 10vh - 16px);display:flex;flex-direction:column;border-radius:26px;background:#fff;color:var(--ox);box-shadow:0 40px 80px -30px rgba(0,0,0,.55);overflow:hidden;animation:enter .3s ease both}
.finder-list.inline{max-height:none;overflow:visible;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.finder-list.inline:empty{display:none}
.finder-list.inline a{background:#fff}
@media (max-width:820px){.finder-list.inline{grid-template-columns:1fr}}
.finder-in{display:flex;flex-direction:column;gap:14px;padding:28px;min-height:0;flex:1}
.finder-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.finder-head h2{margin:0;font-size:28px;font-weight:800;line-height:1.1}
.finder-head .sec-line i{width:110px}
.finder-x{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:#fff;color:var(--ox);cursor:pointer;flex-shrink:0}
.finder-x:hover{border-color:var(--ox)}
.finder-x svg{width:20px;height:20px}
.finder-hint{margin:0;font-size:14px;color:var(--muted)}
.finder-list{list-style:none;margin:0;padding:0 2px 4px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;min-height:0}
.finder-list a{display:flex;align-items:center;gap:16px;padding:12px 16px 12px 12px;border:2px solid var(--line);border-radius:16px;text-decoration:none;color:var(--ox);transition:border-color .15s ease,background .15s ease}
.finder-list a:hover,.finder-list a:focus-visible{border-color:var(--au);background:#FFFBEF}
.f-num{display:grid;place-items:center;flex:0 0 62px;height:56px;border-radius:12px;clip-path:polygon(0 0,100% 0,84% 100%,0 100%);padding-right:8px;font-size:20px;font-weight:800;letter-spacing:-.02em;background:var(--grad-ox);color:#fff}
.f-num.au{background:var(--grad-au);color:var(--ox-deep)}
.f-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.f-txt strong{font-size:17px;font-weight:700;line-height:1.25}
.f-txt span{font-size:13.5px;color:var(--muted)}
.f-tag{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--au-text);text-transform:uppercase}
.f-go{width:20px;height:20px;flex-shrink:0;color:var(--muted)}
@media (max-width:640px){.finder-wrap{padding:10px}.finder{border-radius:20px;max-height:calc(100vh - 20px)}.finder-in{padding:20px}.finder-head h2{font-size:24px}}

/* ---------- Responsivo ---------- */
@media (max-width:1100px){
  .gcards{grid-template-columns:repeat(3,minmax(0,1fr))}
  .mbars{grid-template-columns:1fr}
}
@media (max-width:820px){
  .brand-tag{display:none}
  .sec-head{flex-direction:column;align-items:flex-start}
  .hero-c{grid-template-columns:1fr;min-height:0}
  .hero-c .slab,.hero-c .hair,.hero-c .stripes{display:none}
  .hero-logo{order:-1;justify-content:center;padding:34px 10% 40px;background:var(--grad-ox-d);clip-path:polygon(0 0,100% 0,100% 86%,0 100%)}
  .hero-logo img{max-width:320px}
  .hero-copy{padding:24px 7% 40px}
  .foot-links{text-align:left}
}
@media (max-width:640px){
  .wrap{width:calc(100% - 32px)}
  .top-in{height:72px}
  .brand img{height:50px}
  .top .btn{min-height:44px;padding:0 14px;font-size:14px}
  .gcards{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .gcard{border-radius:18px}
  .canvas{border-radius:18px}
  .tools{padding:16px}
  .hello{min-height:380px;padding:48px 20px}
  .hello .hl,.hello .hb{display:none}
  .hello .hr{clip-path:polygon(0 0,100% 0,100% 12px,0 12px)}
  .hello .hg{clip-path:polygon(0 12px,100% 12px,100% 17px,0 17px)}
  .hello .btn{width:100%}

  function renderLista(mode){
    var st=state[mode], raw=norm(st.q.trim()), out=document.getElementById('lista'), list, html='';

          sub.map(function(g){return cardPres(g,idx++);}).join('')+'</div></div>';
      });
    } else {
      var n2 = (raw.match(/\d+/)||[''])[0];
      if(!n2 && /(online|on line|linea|virtual|grupo)/.test(raw)) raw='';

          sub.map(function(g){return cardLin(g,j++);}).join('')+'</div></div>';
      });
    }
    document.getElementById('count').textContent = list.length===1 ? '1 grupo encontrado' : list.length+' grupos';
    if(!list.length){
      out.innerHTML=empty(mode);
      document.getElementById('reset').onclick=function(){st.q=''; st.fecha=null; render();};

    }
    out.innerHTML=html;
  }

  /* ---------- Motor de búsqueda (región, sede, número, online) ---------- */
  var REGION = {
    'UVM Aguascalientes':'aguascalientes ags',
    'UVM Cd. Victoria':'victoria tamaulipas',
    'UVM Chihuahua':'chihuahua',
    'UVM Coyoacán':'cdmx mexico df',
    'UVM Cuernavaca':'cuernavaca morelos',
    'UVM Cumbres':'monterrey mty nuevoleon',
    'UVM GDL Sur':'guadalajara gdl jalisco',
    'UVM Hermosillo':'hermosillo sonora',
    'UVM Hispano':'cdmx mexico df',
    'UVM Mexicali':'mexicali bajacalifornia',
    'UVM Mérida':'merida yucatan',
    'UVM Querétaro':'queretaro qro',
    'UVM Saltillo':'saltillo coahuila',
    'UVM San Luis Potosí':'slp',
    'UVM San Rafael':'cdmx mexico df',
    'UVM Texcoco':'edomex mexico',
    'UVM Veracruz':'veracruz',
    'UVM Villahermosa':'villahermosa tabasco',
    'UVM Zapopan':'guadalajara gdl jalisco',
    'Unitec Atizapán':'edomex mexico',
    'Unitec Cuitláhuac':'cdmx mexico df',
    'Unitec Ecatepec':'edomex mexico',
    'Unitec Guadalajara':'gdl jalisco',
    'Unitec León':'guanajuato',
    'Unitec Los Reyes':'edomex mexico lapaz',
    'Unitec Monterrey':'mty nuevoleon',
    'Unitec Puebla':'puebla',
    'Unitec Sur':'cdmx mexico df',
    'Unitec Toluca':'edomex mexico'
  };
  var FRASES = [
    [/\bciudad de mexico\b/g,'cdmx'],[/\bcd de mexico\b/g,'cdmx'],[/\bestado de mexico\b/g,'edomex'],[/\bedo mex\b/g,'edomex'],
    [/\bnuevo leon\b/g,'nuevoleon'],[/\bbaja california\b/g,'bajacalifornia'],[/\bsan luis potosi\b/g,'slp'],[/\bsan luis\b/g,'slp'],
    [/\bciudad victoria\b/g,'victoria'],[/\bcd victoria\b/g,'victoria'],[/\bla paz\b/g,'lapaz'],[/\bsan rafael\b/g,'sanrafael'],[/\blos reyes\b/g,'losreyes'],
    [/\bguadalajara sur\b/g,'gdlsur'],[/\bgdl sur\b/g,'gdlsur']
  ];
  var STOP=['grupo','grupos','de','del','la','el','los','las','en','sede','campus','g','no','num','numero','uvm','unitec','universidad','plantel','mi','soy','y'];
  var ONLINE_RX=/\b(online|on line|en linea|linea|virtual|virtuales)\b/;
  function limpiar(q){
    var r=norm(String(q||'')).replace(/[.,;:#°º\-_\/()'"]/g,' ').replace(/\s+/g,' ').trim();
    FRASES.forEach(function(f){ r=r.replace(f[0],f[1]); });
    return r;
  }
  function palabrasSede(sede){
    var base=limpiar(sede);
    return (base+' '+(REGION[sede]||'')).split(' ').filter(Boolean);
  }
  function lev(a,b){
    if(Math.abs(a.length-b.length)>2) return 9;
    var d=[],i,j; for(i=0;i<=a.length;i++){d[i]=[i];} for(j=0;j<=b.length;j++){d[0][j]=j;}
    for(i=1;i<=a.length;i++) for(j=1;j<=b.length;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
    return d[a.length][b.length];
  }
  function coincide(tok,words,flex){
    return words.some(function(w){
      if(w===tok) return true;
      if(tok.length>=3 && w.indexOf(tok)===0) return true;
      if(flex && tok.length>=5 && lev(tok,w)<=(tok.length>=7?2:1)) return true;
      return false;
    });
  }
  function filtrarPres(lista,q){
    var raw=limpiar(q).replace(ONLINE_RX,' ');
    var nums=(raw.match(/\d+/g)||[]).map(function(n){return String(parseInt(n,10));});
    var toks=raw.replace(/\d+/g,' ').split(' ').filter(function(w){return w && STOP.indexOf(w)<0;});
    var num=nums[0];
    var marca=(raw.match(/\b(uvm|unitec)\b/)||[])[1];
    if(!num && !toks.length && marca){ toks=[]; return {lista:lista.filter(function(g){return norm(g.sede).indexOf(marca)===0;}), toks:[marca], num:num}; }
    if(!num && !toks.length) return {lista:lista.slice(), toks:toks, num:num};
    function pasar(flex){
      return lista.filter(function(g){
        if(num && String(g.g)!==num) return false;
        var ws=palabrasSede(g.sede);
        return toks.every(function(t){return coincide(t,ws,flex);});
      });
    }
    var r=pasar(false); if(!r.length && toks.length) r=pasar(true);
    return {lista:r, toks:toks, num:num};
  }
  function buscarTodo(q){
    var raw=limpiar(q);
    if(!raw) return {res:[]};
    var m=raw.match(/^g?v\s*0*(\d+)$/), online=ONLINE_RX.test(raw)||!!m;
    if(online){
      var n=m?String(parseInt(m[1],10)):((raw.match(/\d+/)||[])[0]);
      if(n) n=String(parseInt(n,10));
      var lr=EN_LINEA.filter(function(g){return !n || String(g.v)===n;}).map(function(g){return {lin:g};});
      return {res:lr, tipo:'online'};
    }
    var p=filtrarPres(PRESENCIALES,q);
    var res=p.lista.sort(function(a,b){return a.sede.localeCompare(b.sede,'es')||a.g-b.g;}).map(function(g){return {pres:g};});
    if(p.num && !p.toks.length) EN_LINEA.forEach(function(g){ if(String(g.v)===p.num) res.push({lin:g}); });
    var sedes=p.lista.map(function(g){return g.sede;}).filter(function(v,i,a){return a.indexOf(v)===i;});
    return {res:res, tipo:(!p.num && p.toks.length)?'sede':'num', sedes:sedes};
  }
  function itemHTML(r){
    var go=svg(CHEV,2.4).replace('<svg','<svg class="f-go"');
    if(r.pres){var g=r.pres;
      return '<li><a href="#/grupo-'+g.g+'"><span class="f-num">'+g.g+'</span><span class="f-txt"><span class="f-tag">Presencial · '+esc(g.sede)+'</span><strong>Grupo '+g.g+'</strong><span>Sesiones: '+corta(g.s1)+' y '+corta(g.s2)+'</span></span>'+go+'</a></li>';}
    var v=r.lin;
    return '<li><a href="#/online-'+v.v+'"><span class="f-num au">'+v.v+'</span><span class="f-txt"><span class="f-tag">Online</span><strong>Online · Grupo '+v.v+'</strong><span>Sesiones: '+listaCortas(v.fechas)+'</span></span>'+go+'</a></li>';
  }
  var HINT='Escribe tu ciudad o sede (por ejemplo: Veracruz, Guadalajara o CDMX), tu número de grupo, o "online grupo 1".';
  function pintarEn(input,list,hint){
    var q=input.value, r0=buscarTodo(q), res=r0.res;
    if(!q.trim()){list.innerHTML='';hint.textContent=HINT;return;}
    if(!res.length){list.innerHTML='';hint.textContent='No encontramos resultados. Escribe solo tu ciudad o sede (por ejemplo: Veracruz) o tu número de grupo. Si eres online, escribe: online grupo 1.';return;}
    if(res.length===1) hint.textContent='Encontramos tu grupo. Da clic para entrar.';
    else if(r0.tipo==='sede') hint.textContent='Encontramos '+res.length+' grupos en '+(r0.sedes.length===1?r0.sedes[0]:r0.sedes.length+' sedes: '+r0.sedes.join(', '))+'. Selecciona el tuyo por número de grupo y fechas.';
    else if(r0.tipo==='online') hint.textContent='Hay '+res.length+' grupos online. Selecciona el tuyo por número de grupo y fechas.';
    else hint.textContent='Encontramos '+res.length+' grupos con ese número. Selecciona el de tu modalidad.';
    list.innerHTML=res.map(itemHTML).join('');
  }
  function conectar(input,list,hint,alElegir){
    var f=function(){pintarEn(input,list,hint);};
    ['input','keyup','change','search','compositionend'].forEach(function(ev){input.addEventListener(ev,f);});
    input.addEventListener('keydown',function(e){ if(e.key==='Enter'){e.preventDefault(); f(); var a=list.querySelectorAll('a'); if(a.length===1) a[0].click();} });
    if(alElegir) list.addEventListener('click',function(e){ if(e.target.closest('a')) alElegir(); });
    f();
  }

  /* ---------- Ventana del buscador (botón superior) ---------- */
  var finder=document.getElementById('finder'), fq=document.getElementById('f-q'), fl=document.getElementById('f-list'), fh=document.getElementById('f-hint');
  function abrirBuscador(){
    fq.value=''; pintarEn(fq,fl,fh);
    finder.hidden=false; document.body.style.overflow='hidden';
    setTimeout(function(){fq.focus();},30);
  }
  function cerrarBuscador(){ finder.hidden=true; document.body.style.overflow=''; }
  conectar(fq,fl,fh,cerrarBuscador);
  document.getElementById('f-close').addEventListener('click',cerrarBuscador);
  finder.addEventListener('click',function(e){ if(e.target===finder) cerrarBuscador(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape' && !finder.hidden) cerrarBuscador(); });

  function goMod(){var el=document.getElementById('modalidad'); if(el) el.scrollIntoView({behavior:'smooth'});}
  document.addEventListener('click',function(e){
    if(e.target.closest('[data-go="buscar"]')){ e.preventDefault(); abrirBuscador(); return; }
    var a=e.target.closest('[data-go="modalidad"]'); if(!a) return;
    e.preventDefault();
    if(document.getElementById('modalidad')) goMod();
    else { history.pushState(null,'','#/'); render(); requestAnimationFrame(goMod); }
  });
  window.addEventListener('hashchange',render);
  window.addEventListener('popstate',render);
  render();
})();
</script>

</body>
</html>
